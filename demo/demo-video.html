<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SignalLedger Demo Video</title>
  <style>

    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1220; }
    main { width: min(1200px, 94vw); }

<body>
  <main>
    <h1>SignalLedger / Demo Video</h1>

    <p>Use the speaker control in the player to enable narration.</p>
  </main>
